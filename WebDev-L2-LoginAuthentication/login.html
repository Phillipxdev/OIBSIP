<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | AuthSystem</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="login">

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">

                <div class="brand-icon">
                    A
                </div>

                <span>AuthSystem</span>

            </div>


            <div class="auth-header">

                <p class="eyebrow">
                    WELCOME BACK
                </p>

                <h1>Sign In</h1>

                <p>
                    Enter your details to access your account.
                </p>

            </div>


            <form
                id="login-form"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="login-identifier">
                        Username or Email
                    </label>

                    <input
                        type="text"
                        id="login-identifier"
                        placeholder="Username or email"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="login-password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="login-password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="login-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <div
                    id="login-message"
                    class="form-message"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Sign In
                </button>

            </form>


            <p class="auth-switch">
                Don't have an account?

                <a href="register.html">
                    Create account
                </a>
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
