<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Temperature converter for Celsius, Fahrenheit and Kelvin."
    >

    <title>Temperature Converter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="converter-container">

        <section class="converter-card">

            <p class="label">TEMPERATURE TOOL</p>

            <h1>Temperature Converter</h1>

            <p class="subtitle">
                Convert between Celsius, Fahrenheit and Kelvin.
            </p>

            <form id="converterForm">

                <div class="form-group">

                    <label for="temperature">
                        Temperature
                    </label>

                    <input
                        type="text"
                        id="temperature"
                        placeholder="Enter temperature"
                        autocomplete="off"
                    >

                    <p class="error-message" id="errorMessage"></p>

                </div>


                <div class="form-group">

                    <label for="unit">
                        Input Unit
                    </label>

                    <select id="unit">

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <button type="submit" class="convert-btn">
                    Convert Temperature
                </button>

            </form>


            <section class="results" id="results">

                <h2>Results</h2>

                <div class="result-grid">

                    <div class="result-card">
                        <span>Celsius</span>
                        <strong id="celsiusResult">-- °C</strong>
                    </div>

                    <div class="result-card">
                        <span>Fahrenheit</span>
                        <strong id="fahrenheitResult">-- °F</strong>
                    </div>

                    <div class="result-card">
                        <span>Kelvin</span>
                        <strong id="kelvinResult">-- K</strong>
                    </div>

                </div>

            </section>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
