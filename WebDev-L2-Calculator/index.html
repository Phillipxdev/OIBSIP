<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="A simple browser-based calculator built with HTML, CSS and JavaScript."
    >

    <title>Calculator | Thabiso Phillip Shezi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator-container">

        <section class="calculator" aria-label="Calculator">

            <div class="display-container">
                <div
                    id="previous-display"
                    class="previous-display"
                    aria-live="polite"
                ></div>

                <div
                    id="display"
                    class="display"
                    aria-live="polite"
                >
                    0
                </div>
            </div>

            <div class="calculator-buttons">

                <button type="button" class="btn btn-clear" data-action="clear">
                    C
                </button>

                <button type="button" class="btn btn-delete" data-action="delete" aria-label="Delete last character">
                    ⌫
                </button>

               <button type="button" class="btn btn-operator" data-operator="/">
                    ÷
                </button>

               <button type="button" class="btn btn-operator" data-operator="*">
                    ×
                </button>

                <button type="button" class="btn btn-number" data-number="7">
                    7
                </button>

                <button type="button" class="btn btn-number" data-number="8">
                    8
                </button>

                <button type="button" class="btn btn-number" data-number="9">
                    9
                </button>

                <button type="button" class="btn btn-operator" data-operator="-">
                    −
                </button>

                <button type="button" class="btn btn-number" data-number="4">
                    4
                </button>

                <button type="button" class="btn btn-number" data-number="5">
                    5
                </button>

                <button type="button" class="btn btn-number" data-number="6">
                    6
                </button>

               <button type="button" class="btn btn-operator" data-operator="+">
                    +
                </button>

                <button type="button" class="btn btn-number" data-number="1">
                    1
                </button>

                <button type="button" class="btn btn-number" data-number="2">
                    2
                </button>

                <button type="button" class="btn btn-number" data-number="3">
                    3
                </button>

                <button
                    type="button" class="btn btn-equals" data-action="equals" aria-label="Calculate result">
                    =
                </button>

                <button type="button" class="btn btn-number btn-zero" data-number="0">
                    0
                </button>

                <button type="button" class="btn btn-decimal" data-number="." aria-label="Decimal point">
                    .
                </button>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
