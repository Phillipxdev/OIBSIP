<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Create an account for the authentication system."
    >

    <title>Register | AuthSystem</title>

    <link rel="stylesheet" href="style.css">
</head>

<body data-page="register">

    <main class="auth-container">

        <section class="auth-card">

            <div class="brand">
                <div class="brand-icon">
                    A
                </div>

                <span>AuthSystem</span>
            </div>

            <div class="auth-header">

                <p class="eyebrow">
                    GET STARTED
                </p>

                <h1>Create Account</h1>

                <p>
                    Create your account to access your dashboard.
                </p>

            </div>


            <form
                id="register-form"
                class="auth-form"
            >

                <div class="form-group">

                    <label for="register-username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="register-username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="register-password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="register-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                    <p class="password-hint">
                        Minimum 8 characters and at least one number.
                    </p>

                </div>

                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirm-password"
                            placeholder="Repeat your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-toggle-password="confirm-password"
                            aria-label="Show password"
                        >
                            Show
                        </button>

                    </div>

                </div>

                <div
                    id="register-message"
                    class="form-message"
                    aria-live="polite"
                ></div>

                <button
                    type="submit"
                    class="primary-btn"
                >
                    Create Account
                </button>

            </form>


            <p class="auth-switch">
                Already have an account?

                <a href="login.html">
                    Sign in
                </a>
            </p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
